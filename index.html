<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Interactive 3D Medal - Extra Large with Party Popper</title>
    <meta name="description" content="A-Frame Interactive Golden Medal with Party Popper Effect">
    
    <!-- Include A-Frame Library -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <!-- Custom Script for Mouse Drag Rotation -->
    <script>
      AFRAME.registerComponent('mouse-rotate', {
        schema: {
          speed: {type: 'number', default: 0.5}
        },
        init: function () {
          this.ifMouseDown = false;
          this.x_cord = 0;
          this.y_cord = 0;
          
          document.addEventListener('mousedown', this.OnMouseDown.bind(this));
          document.addEventListener('mouseup', this.OnMouseUp.bind(this));
          document.addEventListener('mousemove', this.OnMouseMove.bind(this));
          
          document.addEventListener('touchstart', this.OnMouseDown.bind(this));
          document.addEventListener('touchend', this.OnMouseUp.bind(this));
          document.addEventListener('touchmove', this.OnMouseMove.bind(this));
        },
        OnMouseDown: function(event) {
          this.ifMouseDown = true;
          this.x_cord = event.clientX || event.touches[0].clientX;
          this.y_cord = event.clientY || event.touches[0].clientY;
        },
        OnMouseUp: function() {
          this.ifMouseDown = false;
        },
        OnMouseMove: function(event) {
          if (this.ifMouseDown) {
            const temp_x = event.clientX || event.touches[0].clientX;
            const temp_y = event.clientY || event.touches[0].clientY;
            
            const deltaX = temp_x - this.x_cord;
            const deltaY = temp_y - this.y_cord;
            
            this.x_cord = temp_x;
            this.y_cord = temp_y;
            
            const rotation = this.el.getAttribute('rotation');
            
            this.el.setAttribute('rotation', {
              x: rotation.x - deltaY * this.data.speed,
              y: rotation.y + deltaX * this.data.speed,
              z: rotation.z
            });
          }
        }
      });
    </script>
    
    <style>
      #ui-overlay {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        text-align: center;
        pointer-events: none;
      }
      .party-btn {
        pointer-events: auto;
        background: linear-gradient(135deg, #FFD700, #FF4500);
        color: #fff;
        border: none;
        padding: 12px 24px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 30px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        transition: transform 0.1s ease;
      }
      .party-btn:active {
        transform: scale(0.95);
      }
      .hint-text {
        color: #333;
        background: rgba(255, 255, 255, 0.85);
        padding: 6px 14px;
        border-radius: 15px;
        margin-top: 8px;
        font-size: 14px;
        font-weight: 600;
        box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      }
    </style>
  </head>
  <body>
    
    <!-- UI Overlay Banner -->
    <div id="ui-overlay">
      <button class="party-btn" onclick="triggerPartyPopper()">Congratulation parnika </button>
      <div class="hint-text">You've secured an 2nd award in overall performance </div>
    </div>

    <a-scene environment="preset: contact; lighting: none; shadow: false;">
      
      <!-- Asset Management -->
      <a-assets>
        <img id="star-icon" src="https://cdn.glitch.global/206f632d-cf41-477d-9477-7422b404d59a/star.png?v=1675862657805" crossorigin="anonymous">
      </a-assets>

      <!-- LIGHTING SETUP -->
      <!-- Base Ambient Light -->
      <a-light type="ambient" color="#FFF" intensity="0.4"></a-light>
      
      <!-- 1. Top White Light -->
      <a-light type="directional" color="#FFFFFF" intensity="3.5" position="0 2 1"></a-light>
      
      <!-- 2. Front White Light -->
      <a-light type="directional" color="#FFFFFF" intensity="3.2" position="0 1.6 4"></a-light>
      
      <!-- 3. Left-Front White Light -->
      <a-light type="directional" color="#FFFFFF" intensity="3.2" position="-4 2 3"></a-light>

      <!-- 4. Right-Front White Light -->
      <a-light type="directional" color="#FFFFFF" intensity="3.2" position="4 2 3"></a-light>

      <!-- Camera positioned to view extra-large centered medal -->
      <a-entity position="0 1.6 4.5">
        <a-camera look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>
      </a-entity>

      <!-- 
        INTERACTIVE MEDAL GROUP
        Scaled up significantly to 2.2x size
      -->
      <a-entity id="medal-group" position="0 1.6 0" scale="2.2 2.2 2.2" mouse-rotate="speed: 0.5">
        
        <!-- THE RIBBON -->
        <a-mixin id="ribbon-mat" material="color: #153a7a; roughness: 0.8; metalness: 0; side: double"></a-mixin>
        <a-triangle mixin="ribbon-mat" vertex-a="0 0.7 0" vertex-b="-0.35 1.25 0" vertex-c="0.35 1.25 0" position="0 0 0"></a-triangle>
        <a-plane material="color: #f5c936; roughness: 0.8; metalness: 0" width="0.12" height="0.55" position="0 0.97 0.001"></a-plane>

        <!-- THE MEDAL BODY (Gold Disc) -->
        <a-cylinder 
          id="medal-disc"
          geometry="radius: 0.65; height: 0.1;"
          rotation="90 0 0" 
          material="color: #A9A9A9; metalness: 0.9; roughness: 0.15;"
          position="0 0.25 0">
        </a-cylinder>

        <!-- Center Icon (Star) -->
        <a-circle 
          geometry="radius: 0.38;"
          material="src: #star-icon; transparent: true; color: #DAA520; metalness: 0.8; roughness: 0.2;"
          position="0 0.25 0.052">
          
        </a-circle>
        
        <!-- Text on Medal -->
        <a-text value="2nd Prize" color="#5c440a" align="center" width="2.0" position="0 0.52 0.052" font="exo2bold"></a-text>
        <a-text value="parnika" color="#5c440a" align="center" width="2.5" position="0 0.02 0.052" font="exo2bold"></a-text>

        <!-- Connector Loop -->
        <a-torus 
          geometry="radius: 0.1; radius-tubular: 0.015;"
          rotation="0 90 0"
          material="color: #DAA520; metalness: 1; roughness: 0.1;"
          position="0 0.88 0">
        </a-torus>
        
      </a-entity>

      <!-- Background Sky -->
      <a-sky color="#ECECEC"></a-sky>
      
    </a-scene>

    <!-- JavaScript for Keyboard Listener & Party Popper Confetti Effect -->
    <script>
      // Listen for 'C' or 'c' keypress
      window.addEventListener('keydown', (event) => {
        if (event.key.toLowerCase() === 'c') {
          triggerPartyPopper();
        }
      });

      // Birthday Party Popper Burst Generator
      function triggerPartyPopper() {
        const scene = document.querySelector('a-scene');
        const origin = { x: 0, y: 1.6, z: 0 };
        const colors = ['#FFD700', '#FF1493', '#00FFFF', '#FF4500', '#7CFC00', '#FF00FF', '#FFFF00', '#00FF7F'];
        const particleCount = 85;

        for (let i = 0; i < particleCount; i++) {
          const confetti = document.createElement('a-plane');
          
          const w = 0.06 + Math.random() * 0.06;
          const h = 0.09 + Math.random() * 0.08;
          confetti.setAttribute('width', w);
          confetti.setAttribute('height', h);
          confetti.setAttribute('color', colors[Math.floor(Math.random() * colors.length)]);
          confetti.setAttribute('side', 'double');
          confetti.setAttribute('position', `${origin.x} ${origin.y} ${origin.z + 0.2}`);
          
          // Explosive velocity vectors
          const vx = (Math.random() - 0.5) * 5.0;
          const vy = Math.random() * 4.5 + 2.5; // Blast upward
          const vz = (Math.random() - 0.5) * 3.5 + 1.0; // Blast forward toward camera
          
          confetti.setAttribute('rotation', `${Math.random()*360} ${Math.random()*360} ${Math.random()*360}`);

          scene.appendChild(confetti);

          // Physics loop for confetti animation
          let posX = origin.x;
          let posY = origin.y;
          let posZ = origin.z + 0.2;
          let curVy = vy;
          const startTime = Date.now();
          const duration = 2500;

          const interval = setInterval(() => {
            const elapsed = Date.now() - startTime;
            if (elapsed > duration) {
              clearInterval(interval);
              if (confetti.parentNode) {
                confetti.parentNode.removeChild(confetti);
              }
              return;
            }

            const dt = 0.016;
            posX += vx * dt;
            curVy -= 5.5 * dt; // Gravity
            posY += curVy * dt;
            posZ += vz * dt;

            confetti.setAttribute('position', `${posX} ${posY} ${posZ}`);
            confetti.setAttribute('rotation', `${elapsed * 0.7} ${elapsed * 1.1} ${elapsed * 0.5}`);
            
            // Fade scale down near lifespan end
            if (elapsed > duration - 600) {
              const scale = (duration - elapsed) / 600;
              confetti.setAttribute('scale', `${scale} ${scale} ${scale}`);
            }
          }, 16);
        }
      }
    </script>
  </body>
</html>
